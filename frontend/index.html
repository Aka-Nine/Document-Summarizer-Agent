<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Intelligence Platform - Test Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .auth-section {
            display: none;
            margin-bottom: 30px;
        }

        .auth-section.active {
            display: block;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #6c757d;
        }

        .file-upload {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-upload:hover {
            background: #f0f2ff;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 15px;
            color: #667eea;
            font-weight: 600;
        }

        .documents-list {
            display: grid;
            gap: 15px;
        }

        .document-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: border-color 0.3s, transform 0.2s;
        }

        .document-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .document-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .document-card .meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 10px;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.processing {
            background: #cfe2ff;
            color: #084298;
        }

        .status.completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status.failed {
            background: #f8d7da;
            color: #842029;
        }

        .query-result {
            background: white;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .query-result h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .query-result p {
            color: #333;
            line-height: 1.6;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert.success {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .alert.error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .alert.info {
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }

        .user-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .user-info.active {
            display: block;
        }

        .user-info strong {
            color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document Intelligence Platform</h1>
            <p>Test Frontend for Document Processing & RAG</p>
        </div>

        <div class="content">
            <!-- User Info -->
            <div class="user-info" id="userInfo">
                <strong>Logged in as:</strong> <span id="username"></span> | 
                <button class="secondary" onclick="logout()" style="margin-left: 10px; padding: 5px 15px; font-size: 14px;">Logout</button>
            </div>

            <!-- Auth Section -->
            <div class="section auth-section active" id="authSection">
                <h2>🔐 Authentication</h2>
                <div id="authAlert"></div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h3 style="margin-bottom: 15px; color: #667eea;">Register</h3>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="regUsername" placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="regEmail" placeholder="Enter email">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="regPassword" placeholder="Enter password">
                        </div>
                        <button onclick="register()">Register</button>
                    </div>

                    <div>
                        <h3 style="margin-bottom: 15px; color: #667eea;">Login</h3>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="loginUsername" placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Enter password">
                        </div>
                        <button onclick="login()">Login</button>
                    </div>
                </div>
            </div>

            <!-- Main App Section -->
            <div class="section hidden" id="mainSection">
                <!-- Upload Section -->
                <div class="section">
                    <h2>📤 Upload Document</h2>
                    <div id="uploadAlert"></div>
                    <div class="form-group">
                        <label>Select Document (PDF, DOCX, TXT)</label>
                        <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" onchange="handleFileSelect(event)">
                            <p>📁 Click to select file or drag and drop</p>
                            <div class="file-info" id="fileInfo"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Optional: Questions (one per line)</label>
                        <textarea id="questions" rows="4" placeholder="What is the main topic?&#10;What are the key points?"></textarea>
                    </div>
                    <button onclick="uploadDocument()" id="uploadBtn">Upload Document</button>
                </div>

                <!-- Documents List -->
                <div class="section">
                    <h2>📚 My Documents</h2>
                    <button onclick="loadDocuments()" style="margin-bottom: 15px;">🔄 Refresh</button>
                    <div id="documentsList">
                        <p>Loading documents...</p>
                    </div>
                </div>

                <!-- Query Section -->
                <div class="section">
                    <h2>❓ Query Document</h2>
                    <div id="queryAlert"></div>
                    <div class="form-group">
                        <label>Select Document</label>
                        <select id="queryDocumentSelect">
                            <option value="">-- Select a document --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Your Question</label>
                        <input type="text" id="queryText" placeholder="What is this document about?">
                    </div>
                    <button onclick="queryDocument()" id="queryBtn">Ask Question</button>
                    <div id="queryResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Check if already logged in
        if (authToken) {
            showMainApp();
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if (!username || !email || !password) {
                showAlert('authAlert', 'Please fill all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showAlert('authAlert', 'Registration successful! Please login.', 'success');
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regPassword').value = '';
                } else {
                    showAlert('authAlert', data.detail || 'Registration failed', 'error');
                }
            } catch (error) {
                showAlert('authAlert', 'Error: ' + error.message, 'error');
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showAlert('authAlert', 'Please enter username and password', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password })
                });

                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    authToken = data.access_token;
                    localStorage.setItem('authToken', authToken);
                    currentUser = { username };
                    showMainApp();
                    showAlert('uploadAlert', 'Login successful!', 'success');
                } else {
                    showAlert('authAlert', data.detail || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('authAlert', 'Error: ' + error.message, 'error');
            }
        }

        function logout() {
            authToken = null;
            localStorage.removeItem('authToken');
            currentUser = null;
            document.getElementById('authSection').classList.add('active');
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('active');
        }

        function showMainApp() {
            document.getElementById('authSection').classList.remove('active');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('active');
            document.getElementById('username').textContent = currentUser?.username || 'User';
            loadDocuments();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileInfo').textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            const questions = document.getElementById('questions').value;

            if (!fileInput.files[0]) {
                showAlert('uploadAlert', 'Please select a file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            if (questions) {
                formData.append('questions', questions);
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerHTML = 'Uploading... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/documents/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    showAlert('uploadAlert', `Document uploaded! ID: ${data.document_id}. Processing...`, 'success');
                    fileInput.value = '';
                    document.getElementById('fileInfo').textContent = '';
                    document.getElementById('questions').value = '';
                    setTimeout(loadDocuments, 2000);
                } else {
                    showAlert('uploadAlert', data.detail || 'Upload failed', 'error');
                }
            } catch (error) {
                showAlert('uploadAlert', 'Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload Document';
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/documents`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const documents = await response.json();
                
                const listDiv = document.getElementById('documentsList');
                const select = document.getElementById('queryDocumentSelect');
                
                if (documents.length === 0) {
                    listDiv.innerHTML = '<p>No documents yet. Upload your first document!</p>';
                    select.innerHTML = '<option value="">-- Select a document --</option>';
                    return;
                }

                listDiv.innerHTML = documents.map(doc => `
                    <div class="document-card">
                        <h3>${doc.filename}</h3>
                        <div class="meta">
                            <span class="status ${doc.status}">${doc.status}</span>
                            ${doc.file_type} • ${(doc.file_size / 1024).toFixed(2)} KB
                            ${doc.chunks_indexed > 0 ? `• ${doc.chunks_indexed} chunks indexed` : ''}
                        </div>
                        ${doc.summary ? `<p style="margin-top: 10px; color: #666;">${doc.summary.substring(0, 200)}...</p>` : ''}
                    </div>
                `).join('');

                select.innerHTML = '<option value="">-- Select a document --</option>' + 
                    documents.filter(doc => doc.status === 'completed' && doc.vector_db_indexed)
                        .map(doc => `<option value="${doc.id}">${doc.filename}</option>`).join('');
            } catch (error) {
                document.getElementById('documentsList').innerHTML = `<p style="color: red;">Error loading documents: ${error.message}</p>`;
            }
        }

        async function queryDocument() {
            const documentId = document.getElementById('queryDocumentSelect').value;
            const query = document.getElementById('queryText').value;

            if (!documentId || !query) {
                showAlert('queryAlert', 'Please select a document and enter a question', 'error');
                return;
            }

            const btn = document.getElementById('queryBtn');
            btn.disabled = true;
            btn.innerHTML = 'Processing... <span class="loading"></span>';

            try {
                const response = await fetch(`${API_BASE}/documents/${documentId}/query`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query, document_id: documentId })
                });

                const data = await response.json();
                
                if (response.ok) {
                    const resultDiv = document.getElementById('queryResult');
                    resultDiv.innerHTML = `
                        <div class="query-result">
                            <h4>Answer:</h4>
                            <p>${data.answer || data.response || 'No answer provided'}</p>
                            ${data.context ? `<p style="margin-top: 15px; font-size: 0.9em; color: #666;"><strong>Context:</strong> ${data.context}</p>` : ''}
                        </div>
                    `;
                    showAlert('queryAlert', 'Query processed successfully!', 'success');
                } else {
                    showAlert('queryAlert', data.detail || 'Query failed', 'error');
                }
            } catch (error) {
                showAlert('queryAlert', 'Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ask Question';
            }
        }

        function showAlert(elementId, message, type) {
            const alertDiv = document.getElementById(elementId);
            alertDiv.innerHTML = `<div class="alert ${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
