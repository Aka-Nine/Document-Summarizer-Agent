version: '3.8'
services:
  app:
    image: document-summarizer-agent:latest
    container_name: doc_app
    restart: unless-stopped
    expose:
      - '8000'
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./app:/usr/src/app

  nginx:
    image: nginx:stable
    container_name: doc_nginx
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/src/app/frontend:ro
      - ./letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done'"
