version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: config/Dockerfile
    env_file:
      - config/.env.local
    environment:
      - ENV_FILE_PATH=config/.env.local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:cached
    depends_on:
      - mongo
      - redis
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data



volumes:
  mongo_data:
  redis_data:
