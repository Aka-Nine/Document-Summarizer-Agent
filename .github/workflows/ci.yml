name: CI

on:
  push:
    branches: [ main, feature ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
      - name: Run tests
        run: |
          pytest -q

  secret-scan:
    name: Scan repository for secrets (gitleaks)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --source . --exit-code 1

  build-and-push:
    name: Build and publish Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Buildx build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: config/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/doc-summarizer-agent:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doc-summarizer-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          # Use the provided GITHUB_TOKEN (workflow needs 'packages: write' permission above)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
